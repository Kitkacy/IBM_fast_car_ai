# Change this to train, evaluate, sweep, or launch.
mode: train

runtime:
  torcs_exe: "../torcs/torcs/wtorcs.exe"
  race_config: "../torcs/torcs/config/raceman/practice.xml"
  target: native
  gui: true
  launch_log: "torcs_launcher.log"

training:
  algorithm: sac
  timesteps: 50000
  seed: 42
  checkpoint_freq: 10000
  eval_episodes: 5
  log_dir: "runs"
  run_name: "torcs-sac"

environment:
  max_episode_steps: 5000
  low_progress_steps: 200
  low_progress_threshold: 5.0

reward:
  track_weight: 0.3
  heading_weight: 0.1
  steering_weight: 0.01
  speed_weight: 0.01
  terminal_penalty: 100.0

wandb:
  enabled: true
  project: "gym-torcs"
  entity: null

evaluation:
  model_path: null

sweep:
  count: 1
  method: bayes
  metric:
    name: "eval/progress_distance"
    goal: maximize
  parameters:
    track_weight:
      values: [0.1, 0.3, 0.6, 1.0]
    heading_weight:
      values: [0.05, 0.15, 0.3, 0.6]
    steering_weight:
      values: [0.0, 0.01, 0.03, 0.06]
    terminal_penalty:
      values: [50, 100, 200, 400]
    sac_learning_rate:
      distribution: log_uniform_values
      min: 1e-5
      max: 1e-3
    sac_batch_size:
      values: [64, 128, 256, 512]
    sac_buffer_size:
      values: [50000, 100000, 200000]
    sac_learning_starts:
      values: [500, 1000, 2000]
  early_terminate:
    type: hyperband
    min_iter: 3

sac:
  learning_rate: 3.0e-4
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 256
  train_freq: 1
  gradient_steps: 1
  gamma: 0.99
  tau: 0.005
  ent_coef: "auto"
  target_entropy: "auto"
  net_arch: [256, 256]
